[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-automation-lab"
version = "0.1.0"
description = "A collection of practical Python automation tools."
requires-python = ">=3.11"

[project.scripts]
find-duplicates = "automation_lab.duplicates:main"

[tool.setuptools.packages.find]
where = ["src"]